name: GitHub Release Build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and re-attach assets for, e.g. v1.0.0"
        required: true

permissions:
  contents: write # required to attach APK assets to the release itself

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate APKs
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if ! printf "%s" "$release_version" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "Invalid release version '$release_version'." >&2
            exit 1
          fi

          export TERMUX_STYLING_APP_BUILD__APP_VERSION_NAME="$release_version"
          ./gradlew testDebugUnitTest lintDebug :app:assembleDebug :app:assembleRelease

          debug_dir="app/build/outputs/apk/debug"
          release_dir="app/build/outputs/apk/release"
          debug_name="termux-neon-debug_${RELEASE_TAG}.apk"
          release_name="termux-neon-release-unsigned_${RELEASE_TAG}.apk"
          cp "$debug_dir/app-debug.apk" "$debug_dir/$debug_name"
          cp "$release_dir/app-release-unsigned.apk" "$release_dir/$release_name"
          (cd "$debug_dir" && sha256sum "$debug_name" > checksums-debug-sha256.txt)
          (cd "$release_dir" && sha256sum "$release_name" > checksums-release-sha256.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-neon-${{ env.RELEASE_TAG }}
          path: |
            app/build/outputs/apk/debug/termux-neon-debug_${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/debug/checksums-debug-sha256.txt
            app/build/outputs/apk/release/termux-neon-release-unsigned_${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/checksums-release-sha256.txt

      # The workflow-run artifact above expires and needs a GitHub login to
      # download; also attach the same files directly to the release itself
      # so the README's "download from the Releases page" instructions hold.
      - name: Attach APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "app/build/outputs/apk/debug/termux-neon-debug_${{ env.RELEASE_TAG }}.apk" \
            "app/build/outputs/apk/debug/checksums-debug-sha256.txt" \
            "app/build/outputs/apk/release/termux-neon-release-unsigned_${{ env.RELEASE_TAG }}.apk" \
            "app/build/outputs/apk/release/checksums-release-sha256.txt" \
            --repo "${{ github.repository }}" \
            --clobber
